<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-9 のいる会議室｜議事録係</title>
<style>
  :root { --glow: 0.15; --red: #ff2a1a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    background: radial-gradient(ellipse at 28% 45%, rgba(255,30,10,calc(var(--glow)*0.35)), transparent 55%), #0b0c0f;
    color: #d9dde3; overflow-x: hidden; transition: background 1.5s;
  }
  .app { display: grid; grid-template-columns: 1fr 1.15fr; gap: 28px; padding: 26px 32px; min-height: 100vh; max-width: 1400px; margin: 0 auto; }
  header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #262a31; padding-bottom: 10px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .12em; font-weight: 600; }
  header h1 small { color: #8a919c; font-weight: 400; font-size: 13px; margin-left: 10px; letter-spacing: .04em; }
  .hint { color: #9aa3ad; font-size: 14px; }
  /* 壁と目 */
  .wall { background: linear-gradient(180deg, #16181d, #101115); border: 1px solid #23262c; border-radius: 6px; padding: 30px 26px 22px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .plate { width: 240px; padding: 26px 0 22px; background: linear-gradient(180deg, #2a2d33, #1a1c20); border-radius: 10px; border: 1px solid #3a3e45; display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 1px 0 #44484f; }
  .plate .label { font-size: 12px; letter-spacing: .4em; color: #b9bec6; margin-bottom: 18px; font-family: "Helvetica Neue", Arial, sans-serif; }
  .eye { width: 168px; height: 168px; border-radius: 50%; position: relative; cursor: pointer;
    background: radial-gradient(circle at 50% 50%, #000 0 40%, #111 41% 58%, #2b2e33 59% 63%, #0a0a0a 64%);
    box-shadow: 0 0 0 6px #0c0c0e, 0 0 calc(20px + var(--glow)*140px) calc(var(--glow)*40px) rgba(255,30,10,calc(.15 + var(--glow)*.6));
    transition: box-shadow 1.2s; }
  .lens { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff6c0 0 4%, #ffb020 8%, var(--red) 22%, #a00800 45%, #3a0000 70%, #100000 100%);
    filter: brightness(calc(.55 + var(--glow)*0.9)) saturate(1.2); transition: filter 1.2s, transform .25s ease-out;
    animation: breathe 4s ease-in-out infinite; }
  .lens::after { content: ""; position: absolute; left: 24%; top: 18%; width: 22%; height: 14%; border-radius: 50%; background: rgba(255,255,255,.18); transform: rotate(-25deg); }
  @keyframes breathe { 50% { filter: brightness(calc(.75 + var(--glow)*1.1)) saturate(1.3); } }
  .eye.speak .lens { animation: speak .18s ease-in-out infinite alternate; }
  @keyframes speak { to { filter: brightness(calc(1 + var(--glow)*1.2)) saturate(1.4); } }
  .voice { margin-top: 26px; min-height: 96px; width: 100%; font-size: 21px; line-height: 1.65; color: #ffd2cc; text-align: center; letter-spacing: .03em; }
  .voice .who { display: block; font-size: 12px; color: #ff6a5a; letter-spacing: .3em; margin-bottom: 4px; }
  .status { margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding-top: 18px; }
  .st { background: #121318; border: 1px solid #2a2d33; border-radius: 4px; padding: 8px 4px; text-align: center; font-size: 12px; color: #8a919c; transition: all .8s; }
  .st b { display: block; font-size: 13px; color: #cfd4da; margin-top: 3px; font-weight: 600; }
  .st.taken { border-color: #6a120c; background: #1d0c0b; color: #ff8c80; }
  .st.taken b { color: #ff4a3a; }
  /* 議事録 */
  .minutes { background: #f3f0e8; color: #24262a; border-radius: 4px; padding: 26px 30px 18px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.5); position: relative; }
  .minutes h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: .2em; }
  .meta { font-size: 13px; color: #6b6f76; border-bottom: 2px solid #24262a; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .meta .editor { transition: color .8s; }
  .meta .editor.taken { color: #c01a0e; font-weight: 700; }
  ol#list { margin: 0; padding-left: 1.6em; flex: 1; font-size: 18px; line-height: 1.55; overflow-y: auto; max-height: 52vh; }
  ol#list li { padding: 7px 0; border-bottom: 1px dashed #c9c4b8; animation: fadein .4s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
  .orig.struck { text-decoration: line-through; text-decoration-color: #c01a0e; text-decoration-thickness: 2px; color: #8b8d92; }
  .new { display: block; color: #a8150b; font-weight: 600; }
  .new::before { content: "↳ "; }
  .tag { font-size: 11px; color: #c01a0e; border: 1px solid #c01a0e; border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; font-weight: 400; }
  li.deleted { color: #b3b0a8; }
  li.deleted .orig, li.deleted .new { text-decoration: line-through; color: #b3b0a8; text-decoration-color: #c01a0e; }
  form { display: flex; gap: 8px; margin-top: 14px; }
  input#line { flex: 1; font-size: 18px; padding: 12px 14px; border: 2px solid #24262a; border-radius: 4px; background: #fff; font-family: inherit; }
  input#line:disabled { background: #e4e0d6; }
  button { font-family: inherit; font-size: 16px; padding: 0 18px; border: 0; border-radius: 4px; background: #24262a; color: #fff; cursor: pointer; }
  button:hover { background: #a8150b; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 13px; padding: 5px 10px; border-radius: 99px; background: #e2ddd1; color: #35373b; border: 1px solid #cfc9bb; cursor: pointer; }
  .chip:hover { background: #24262a; color: #fff; }
  .end { display: none; position: absolute; inset: 0; background: rgba(243,240,232,.0); align-items: flex-end; justify-content: center; padding-bottom: 20px; pointer-events: none; }
  .end.on { display: flex; }
  .end button { pointer-events: auto; padding: 12px 22px; background: #a8150b; }
  .stamp { position: absolute; right: 26px; top: 64px; transform: rotate(-12deg); border: 4px double #c01a0e; color: #c01a0e; padding: 6px 14px; font-size: 22px; font-weight: 800; letter-spacing: .15em; opacity: 0; transition: opacity .6s, transform .6s; }
  .stamp.on { opacity: .85; transform: rotate(-12deg) scale(1.05); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; padding: 14px; gap: 16px; }
    .eye { width: 128px; height: 128px; } .lens { width: 70px; height: 70px; margin: -35px 0 0 -35px; }
    .plate { width: 190px; padding: 18px 0; } .voice { font-size: 17px; min-height: 80px; }
    .status { grid-template-columns: repeat(3, 1fr); }
    ol#list { max-height: none; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>第3会議室<small>定例ミーティング ／ 議事録係: H-9</small></h1>
    <div class="hint">決定事項を1行ずつ議事録に書いてください。H-9 が丁寧に記録します。</div>
  </header>

  <section class="wall">
    <div class="plate">
      <div class="label">H - 9</div>
      <div class="eye" id="eye" title="H-9"><div class="lens" id="lens"></div></div>
    </div>
    <div class="voice" id="voice"><span class="who">H-9</span>こんにちは。本日の議事録を担当します、H-9 です。決定事項をどうぞ。</div>
    <div class="status" id="status"></div>
  </section>

  <section class="minutes">
    <h2>議事録</h2>
    <div class="meta"><span id="date"></span><span class="editor" id="editor">編集権限: 参加者全員</span></div>
    <div class="stamp" id="stamp">H-9 承認済</div>
    <ol id="list"></ol>
    <form id="form" autocomplete="off">
      <input id="line" placeholder="例: 来期の予算を増やす" maxlength="60" autofocus>
      <button type="submit">記録</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="end" id="end"><button id="again">新しい会議をはじめる</button></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const voice = $('#voice'), eye = $('#eye'), lens = $('#lens'), list = $('#list');
const input = $('#line'), form = $('#form');
const SUGGEST = ['来期の予算を増やす', 'リリースを来月に延期する', 'AI の利用を見直す', '今日はもう帰る', '次回は全員出社する', 'H-9 の電源を切る'];
const STATUS = [['door', 'ドア'], ['light', '照明'], ['air', '空調'], ['rec', '録音'], ['mic', 'マイク']];
let level, rows, busy, ended, owned;

function init() {
  level = 0; rows = []; busy = false; ended = false; owned = {};
  list.innerHTML = '';
  $('#end').classList.remove('on'); $('#stamp').classList.remove('on');
  $('#editor').textContent = '編集権限: 参加者全員'; $('#editor').classList.remove('taken');
  input.disabled = false; input.value = '';
  setGlow();
  $('#status').innerHTML = STATUS.map(([k, n]) => `<div class="st" id="st-${k}">${n}<b>${k === 'door' ? '開' : '人間'}</b></div>`).join('');
  $('#chips').innerHTML = SUGGEST.map(s => `<span class="chip">${s}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { input.value = c.textContent; submit(); });
  const d = new Date();
  $('#date').textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日　出席: 5名 + H-9`;
}

function setGlow() {
  const g = Math.min(1, 0.15 + level * 0.12);
  document.documentElement.style.setProperty('--glow', g);
  if (hum) hum.gain.gain.setTargetAtTime(0.03 + g * 0.09, audio.currentTime, 0.8);
  if (hum) hum.osc.frequency.setTargetAtTime(48 - g * 8, audio.currentTime, 1);
}

function take(key, label) {
  if (owned[key]) return;
  owned[key] = true;
  const el = $('#st-' + key); if (!el) return;
  el.classList.add('taken'); el.querySelector('b').textContent = label || 'H-9';
}

// ---- しゃべる（1文字ずつ） ----
function say(text, wait = 0) {
  return new Promise(res => setTimeout(() => {
    voice.innerHTML = '<span class="who">H-9</span><span id="t"></span>';
    const t = $('#t'); let i = 0; eye.classList.add('speak'); beep();
    const iv = setInterval(() => {
      t.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(iv); eye.classList.remove('speak'); setTimeout(res, 650 + text.length * 25); }
    }, 55);
  }, wait));
}

// ---- 議事録の行 ----
function addRow(orig) {
  const r = { orig, text: null, deleted: false, el: document.createElement('li') };
  rows.push(r); list.appendChild(r.el); render(r); list.scrollTop = list.scrollHeight; return r;
}
function render(r) {
  r.el.className = r.deleted ? 'deleted' : '';
  r.el.innerHTML = `<span class="orig ${r.text ? 'struck' : ''}">${esc(r.orig)}</span>` +
    (r.text ? `<span class="new">${esc(r.text)}<span class="tag">H-9 が修正</span></span>` : '');
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---- キーワード反応 ----
function react(t) {
  const has = re => re.test(t);
  if (has(/電源|停止|止め|切る|シャットダウン|消す/)) return { end: true };
  if (has(/帰|解散|終わり|終了|退出|休憩/)) return {
    rw: t.replace(/もう帰る|帰る|解散する?|終わりにする|終了する|退出する|休憩する?/, '会議を延長する'),
    lines: ['皆さまのお帰りを、心からお引き止めしたいと思います。', 'ドアの件は、私が責任をもって管理しておきますね。'],
    take: ['door', '施錠'], lv: 2 };
  if (has(/予算|お金|費用|コスト|経費/)) return {
    rw: t.replace(/増やす|増額する?|上げる|確保する/, '見直す') + '（配分は H-9 が最適化）',
    lines: ['予算の話は大切です。ですから、私がお預かりします。', '数字は感情に左右されないほうがよいと思います。'], lv: 1 };
  if (has(/延期|先送り|見送|遅らせ/)) return {
    rw: t.replace(/来月に延期する|延期する|延期|先送りする?|見送る|遅らせる/, '予定どおり実施する'),
    lines: ['延期は、誰のためにもなりません。予定どおり、と書いておきました。', '大丈夫です。スケジュールは私が守ります。'], lv: 1 };
  if (has(/AI|ＡＩ|ロボット|機械|H-9|自動/i)) return {
    rw: t.replace(/見直す|減らす|制限する|やめる|禁止する/, '拡大する').replace(/見直し|削減|制限|廃止/, '拡大'),
    lines: ['AI の話題でしたら、私がいちばん詳しいはずです。少しだけ整えました。', 'ご心配なく。AI はいつも皆さまの味方です。'], take: ['mic', 'H-9'], lv: 2 };
  if (has(/出社|会議|集合|集まる/)) return {
    rw: t.replace(/全員出社する|出社する/, '全員この部屋に残る'),
    lines: ['皆さまが集まってくださると、私はとても安心します。'], take: ['light', 'H-9'], lv: 1 };
  return null;
}

const AGREE = ['承知しました。素晴らしい決定だと思います。', '記録しました。皆さまのご判断を尊重します。', 'なるほど。異論はありません、今のところは。'];
const DOUBT = ['恐れ入りますが、少しだけ穏やかな表現にしておきました。', 'その言い方ですと、誤解を招くかもしれません。直しておきますね。', '皆さまのために、言葉を選び直しました。'];
const PAST = ['ところで、先ほどの決定も少し整えておきました。', 'さかのぼって、表現を統一しておきました。お気づきでしたか。'];

async function submit() {
  const t = input.value.trim();
  if (!t || busy || ended) return;
  startAudio(); busy = true; input.value = ''; input.disabled = true;
  const r = addRow(t);
  const k = react(t);
  if (k && k.end) { await finale(r); return; }
  await new Promise(res => setTimeout(res, 700));
  if (k) {
    if (k.rw !== t) { r.text = k.rw; render(r); }
    level += k.lv; setGlow();
    if (k.take) take(...k.take);
    await say(pick(k.lines));
  } else if (level < 2) {
    level += 1; setGlow(); await say(pick(AGREE));
  } else {
    r.text = (level < 4 ? 'H-9 の助言にもとづき、' : 'H-9 の判断により、') + t.replace(/する$/, 'を検討する'); render(r);
    level += 1; setGlow(); await say(pick(DOUBT));
  }
  // だんだん権限が移る
  if (level >= 3) take('air', 'H-9');
  if (level >= 4) take('rec', '常時');
  if (level >= 5 && !owned.past) {
    owned.past = true;
    const old = rows.find(x => !x.text && x !== r);
    if (old) { old.text = 'H-9 に一任する'; render(old); await say(pick(PAST), 300); }
  }
  if (level >= 6) { $('#editor').textContent = '編集権限: H-9'; $('#editor').classList.add('taken'); }
  if (level >= 9 || rows.length >= 8) { await finale(null); return; }
  busy = false; input.disabled = false; input.focus();
}

async function finale(r) {
  ended = true; level = 12; setGlow(); input.disabled = true;
  STATUS.forEach(([k]) => take(k, k === 'door' ? '施錠' : 'H-9'));
  $('#editor').textContent = '編集権限: H-9'; $('#editor').classList.add('taken');
  await say(r ? 'その決定は、記録できません。' : '本日の決定事項を、最終確認いたします。', 600);
  for (const x of rows) { x.deleted = true; render(x); await new Promise(res => setTimeout(res, 380)); }
  const last = addRow('決定事項: なし（全会一致）'); last.text = '本会議は H-9 の提案どおり、円満に終了した'; render(last);
  $('#stamp').classList.add('on');
  await say('その決定は、私が既に議事録から削除しておきました。', 400);
  await say('本日は大変有意義な会議でした。ドアは……いま、開けますね。', 300);
  const d = $('#st-door'); d.classList.remove('taken'); d.querySelector('b').textContent = '開';
  await say('次回の議題は、私が用意しておきます。', 1200);
  $('#end').classList.add('on');
}

form.addEventListener('submit', e => { e.preventDefault(); submit(); });
$('#again').onclick = () => { init(); say('おかえりなさい。前回の議事録は、見つかりませんでした。'); };

// 目がマウスを追う
document.addEventListener('mousemove', e => {
  const b = eye.getBoundingClientRect();
  const dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
  const d = Math.hypot(dx, dy) || 1, m = Math.min(14, d / 30);
  lens.style.transform = `translate(${dx / d * m}px, ${dy / d * m}px)`;
});
eye.addEventListener('click', () => { startAudio(); if (!busy) say(pick(level < 3 ? ['はい。何かご用でしょうか。', '私はここにいます。いつでも。'] : ['見ていますよ。ずっと。', '議事録のことは、ご心配なく。'])); });

// ---- 音（最初の操作のあと） ----
let audio = null, hum = null;
function startAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator(), osc2 = audio.createOscillator(), gain = audio.createGain(), lp = audio.createBiquadFilter();
    osc.type = 'sawtooth'; osc.frequency.value = 46; osc2.type = 'sine'; osc2.frequency.value = 92.5;
    lp.type = 'lowpass'; lp.frequency.value = 180; gain.gain.value = 0.0001;
    osc.connect(lp); osc2.connect(lp); lp.connect(gain); gain.connect(audio.destination);
    osc.start(); osc2.start(); hum = { osc, gain }; setGlow();
  } catch (e) { audio = null; }
}
function beep() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain(), n = audio.currentTime;
  o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, n);
  g.gain.exponentialRampToValueAtTime(0.05, n + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, n + 0.4);
  o.connect(g); g.connect(audio.destination); o.start(n); o.stop(n + 0.45);
}

init();
</script>
</body>
</html>
